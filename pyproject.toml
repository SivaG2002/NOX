[project]
name = "discord-stream-notifier"
version = "0.1.0"
description = "Discord stream notification bot with FastAPI dashboard"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.5",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "discord.py>=2.4.0",
    "email-validator>=2.2.0",
    "fastapi>=0.112.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["docker*", "migrations*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]
